<div class="payment-methods">

  <header class="payment-methods__header">
    <h1 class="payment-methods__title">Payment Methods</h1>
    <p class="payment-methods__subtitle">Manage your saved payment methods for faster checkout.</p>
  </header>

  <div class="payment-methods__empty">
    <i class="fa-regular fa-credit-card payment-methods__empty-icon" aria-hidden="true"></i>
    <h2 class="payment-methods__empty-title">No payment methods saved</h2>
    <p class="payment-methods__empty-message">You haven't added a payment method yet.</p>
    <button class="payment-methods__add" type="button">
      <i class="fa-solid fa-plus" aria-hidden="true"></i>
      <span>Add Payment Method</span>
    </button>
  </div>

</div>
