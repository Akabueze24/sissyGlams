<div
  class="auth-overlay"
  *ngIf="isOpen"
  (click)="close()"
  role="presentation"
>
  <div
    class="auth-modal"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="authMode === 'login' ? 'authLoginHeading' : 'authRegisterHeading'"
    (click)="$event.stopPropagation()"
  >
    <button
      class="auth-modal__close"
      type="button"
      (click)="close()"
      aria-label="Close authentication dialog"
    >
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>

    <div class="auth-modal__brand">
      <span class="auth-modal__brand-word">Sissy<span class="auth-modal__brand-accent">Dream</span></span>
    </div>

    <!-- ============================================================
         LOGIN VIEW
    ============================================================ -->
    <div class="auth-modal__view" *ngIf="authMode === 'login'">
      <h2 id="authLoginHeading" class="auth-modal__heading">Welcome Back</h2>
      <p class="auth-modal__subtext">Sign in to your Sissy Dream account.</p>

      <form class="auth-form">

        <div class="auth-form__group">
          <label for="loginEmail" class="auth-form__label">Email Address</label>
          <input
            id="loginEmail"
            class="auth-form__input"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>

        <div class="auth-form__group">
          <label for="loginPassword" class="auth-form__label">Password</label>
          <div class="auth-form__password-wrap">
            <input
              id="loginPassword"
              class="auth-form__input"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Enter your password"
              autocomplete="current-password"
            />
            <button
              class="auth-form__password-toggle"
              type="button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <i class="fa-regular" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" aria-hidden="true"></i>
            </button>
          </div>
          <!-- Error message placeholder — populated once real validation exists -->
          <p class="auth-form__error" aria-live="polite"></p>
        </div>

        <div class="auth-form__row">
          <label class="auth-form__checkbox">
            <input type="checkbox" />
            <span>Remember me</span>
          </label>
          <a class="auth-form__link" href="/forgot-password">Forgot Password?</a>
        </div>

        <button class="auth-form__submit" type="submit">Sign In</button>
      </form>

      <div class="auth-divider"><span>Or continue with</span></div>

      <button class="auth-social-btn" type="button">
        <i class="fa-brands fa-google" aria-hidden="true"></i>
        <span>Continue with Google</span>
      </button>

      <p class="auth-modal__switch">
        Don't have an account?
        <button class="auth-modal__switch-link" type="button" (click)="switchTo('register')">Create Account</button>
      </p>
    </div>

    <!-- ============================================================
         REGISTER VIEW
    ============================================================ -->
    <div class="auth-modal__view" *ngIf="authMode === 'register'">
      <h2 id="authRegisterHeading" class="auth-modal__heading">Create Your Account</h2>
      <p class="auth-modal__subtext">Join Sissy Dream and enjoy a more personalized shopping experience.</p>

      <form class="auth-form">

        <div class="auth-form__row-group">
          <div class="auth-form__group">
            <label for="registerFirstName" class="auth-form__label">First Name</label>
            <input
              id="registerFirstName"
              class="auth-form__input"
              type="text"
              placeholder="Jane"
              autocomplete="given-name"
            />
          </div>
          <div class="auth-form__group">
            <label for="registerLastName" class="auth-form__label">Last Name</label>
            <input
              id="registerLastName"
              class="auth-form__input"
              type="text"
              placeholder="Doe"
              autocomplete="family-name"
            />
          </div>
        </div>

        <div class="auth-form__group">
          <label for="registerEmail" class="auth-form__label">Email Address</label>
          <input
            id="registerEmail"
            class="auth-form__input"
            type="email"
            placeholder="you@example.com"
            autocomplete="email"
          />
        </div>

        <div class="auth-form__group">
          <label for="registerPassword" class="auth-form__label">Password</label>
          <div class="auth-form__password-wrap">
            <input
              id="registerPassword"
              class="auth-form__input"
              [type]="showPassword ? 'text' : 'password'"
              placeholder="Create a password"
              autocomplete="new-password"
            />
            <button
              class="auth-form__password-toggle"
              type="button"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            >
              <i class="fa-regular" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" aria-hidden="true"></i>
            </button>
          </div>
          <!-- Password strength placeholder — visual only, no scoring logic yet -->
          <div class="auth-form__strength" aria-hidden="true">
            <span class="auth-form__strength-bar"></span>
            <span class="auth-form__strength-bar"></span>
            <span class="auth-form__strength-bar"></span>
          </div>
        </div>

        <div class="auth-form__group">
          <label for="registerConfirmPassword" class="auth-form__label">Confirm Password</label>
          <div class="auth-form__password-wrap">
            <input
              id="registerConfirmPassword"
              class="auth-form__input"
              [type]="showConfirmPassword ? 'text' : 'password'"
              placeholder="Re-enter your password"
              autocomplete="new-password"
            />
            <button
              class="auth-form__password-toggle"
              type="button"
              (click)="toggleConfirmPasswordVisibility()"
              [attr.aria-label]="showConfirmPassword ? 'Hide password' : 'Show password'"
            >
              <i class="fa-regular" [class.fa-eye]="!showConfirmPassword" [class.fa-eye-slash]="showConfirmPassword" aria-hidden="true"></i>
            </button>
          </div>
          <p class="auth-form__error" aria-live="polite"></p>
        </div>

        <label class="auth-form__checkbox auth-form__checkbox--terms">
          <input type="checkbox" />
          <span>I agree to the <a href="/terms">Terms &amp; Conditions</a> and <a href="/privacy">Privacy Policy</a>.</span>
        </label>

        <button class="auth-form__submit" type="submit">Create Account</button>
      </form>

      <p class="auth-modal__switch">
        Already have an account?
        <button class="auth-modal__switch-link" type="button" (click)="switchTo('login')">Sign In</button>
      </p>
    </div>

  </div>
</div>
