<swiper-container
  *ngIf="products.length"
  class="ebooks__swiper"
  slides-per-view="2"
  space-between="16"
  loop="true"
  navigation="true"
  autoplay="true"
  breakpoints='{"576": {"slidesPerView": 3}, "768": {"slidesPerView": 4}, "992": {"slidesPerView": 5}}'
>
  <swiper-slide *ngFor="let product of products">
    <app-product-card [product]="product"></app-product-card>
  </swiper-slide>
</swiper-container>
